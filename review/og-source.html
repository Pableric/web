<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SofL social preview source</title>
    <style>
      @font-face {
        font-family: "Instrument Sans";
        src: url("../site/assets/fonts/InstrumentSans-Regular.woff2") format("woff2");
        font-weight: 400;
      }

      @font-face {
        font-family: "Instrument Sans";
        src: url("../site/assets/fonts/InstrumentSans-SemiBold.woff2") format("woff2");
        font-weight: 600;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        padding: 24px;
        background: #f1f1ef;
        color: #090909;
        font-family: "Instrument Sans", Arial, sans-serif;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding-bottom: 18px;
      }

      .brand {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 3px;
        background: #090909;
        color: #f7f7f5;
        font-size: 19px;
        font-weight: 600;
      }

      .meta {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        width: 880px;
        margin: 46px 0 0;
        font-size: 88px;
        font-weight: 400;
        line-height: 0.86;
        letter-spacing: -0.07em;
      }

      h1 em {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
      }

      .visual {
        position: absolute;
        right: 24px;
        bottom: 24px;
        left: 24px;
        height: 280px;
        overflow: hidden;
        background: #090909;
        color: #f7f7f5;
      }

      .number {
        position: absolute;
        right: 56px;
        bottom: 54px;
        display: flex;
        align-items: flex-start;
        font-size: 210px;
        font-weight: 600;
        line-height: 0.72;
        letter-spacing: -0.1em;
      }

      .number small {
        margin: 4px 0 0 12px;
        font-size: 44px;
        font-weight: 400;
      }

      .track {
        position: absolute;
        right: 64px;
        bottom: 30px;
        width: 344px;
        height: 3px;
        background: #f7f7f5;
      }

      .track::after {
        position: absolute;
        top: -5px;
        right: 0;
        width: 13px;
        height: 13px;
        border: 1px solid #f7f7f5;
        border-radius: 50%;
        background: #090909;
        content: "";
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">S</span>
      <span class="meta">High-performance derivatives pricing</span>
    </header>
    <h1>Derivatives pricing.<br /><em>At hardware speed.</em></h1>
    <div class="visual">
      <div class="number">28<small>×</small></div>
      <div class="track"></div>
    </div>
  </body>
</html>
